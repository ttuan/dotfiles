# herdr configuration — https://herdr.dev/docs/configuration/
# Symlinked to ~/.config/herdr/config.toml (see install.conf.yaml)

onboarding = false

[terminal]
new_cwd = "follow"  # new panes/tabs inherit the focused pane's cwd (this is the default)

[keys]
# Backtick as prefix (trial). If typing literal ` gets painful
# (code blocks, shell substitution), switch to "ctrl+space".
prefix = "`"
rename_tab = "prefix+,"             # default: prefix+shift+t
rename_workspace = "prefix+<"       # i.e. shift+, — terminals send the shifted char; default: prefix+shift+w

# tmux muscle-memory mappings (see ~/.tmux.conf)
split_vertical = "prefix+|"      # side-by-side split, like tmux `prefix |` (default: prefix+v)
close_pane = "prefix+="          # like tmux `prefix =` kill-pane (default: prefix+x)
copy_mode = "prefix+["           # like tmux (this is also the default; stated so it wins over agents)
last_pane = "prefix+;"           # like tmux `prefix ;` (default: unbound)
detach = "prefix+d"              # like tmux (default: prefix+q)
# Sidebar: default prefix+b, plus prefix-free ctrl+alt+left (ctrl+alt is free in
# skhd and iTerm2; ctrl+shift+left moves tabs now)
toggle_sidebar = ["prefix+b", "ctrl+alt+left"]

# Workspaces: tmux `prefix ( )` plus prefix-free ctrl+shift+[ ]. Two spellings
# each, because terminals send shift+[ either as shift+[ or as {.
previous_workspace = ["prefix+(", "ctrl+shift+[", "ctrl+{"]
next_workspace = ["prefix+)", "ctrl+shift+]", "ctrl+}"]

# Reorder tabs without the prefix (default: unbound)
move_tab_previous = "ctrl+shift+left"
move_tab_next = "ctrl+shift+right"

# Swap reload/resize compared to the defaults (reload prefix+shift+r, resize prefix+r)
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Pane resize in one keystroke, like tmux-pain-control `prefix H/J/K/L`.
# Native actions (default: unbound) instead of shelling out to `herdr pane resize`.
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
# ...which displaces swap_pane_* (default: prefix+shift+h/j/k/l)
swap_pane_left = "prefix+alt+h"
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"

# prefix+e is "close other panes" (custom command below), which displaces
# edit_scrollback (default: prefix+e)
edit_scrollback = "prefix+shift+e"

# prefix+g runs lazygit and prefix+o jumps to the next waiting agent (custom commands below), so
# goto and open_notification_target move (defaults: prefix+g, prefix+o)
goto = "prefix+u"
open_notification_target = "prefix+shift+o"

# Jump between agents (herdr leaves all 3 unbound by default). Avoid p/n
# (already previous/next tab), (/) (already workspace) and [ (copy mode).
previous_agent = "prefix+{"
next_agent = "prefix+}"
focus_agent = "prefix+alt+1..9"  # jump straight to the Nth agent

# The code / agents / console tab set at the cwd of the focused pane.
# herdr has no "startup tabs" option in the config, so a script drives the
# socket API instead (herdr workspace/tab create). `type = "shell"` runs
# detached and does not take over a pane. The script is idempotent: a tab that
# already has the right name is reused.
#
# Turns the CURRENT workspace into those 3 tabs, then closes the current tab.
# Note: a tab running an agent gets killed (unless it is one of the 3 tabs).
[[keys.command]]
key = "prefix+t"   # t = tabs. Avoid p/n (previous/next tab) and alt (awkward meta key).
type = "shell"
description = "Replace this tab with code/agents/console"
command = "~/.local/bin/herdr-workspace-3tabs --here"

# A NEW workspace with those 3 tabs.
[[keys.command]]
key = "prefix+shift+t"  # rename_tab moved to prefix+, so shift+t is free
type = "shell"
description = "New workspace: code/agents/console"
command = "~/.local/bin/herdr-workspace-3tabs"

# # Open the focused pane's directory in Finder.
# [[keys.command]]
# key = "prefix+o"
# type = "shell"
# description = "Open cwd in Finder"
# command = 'open "$HERDR_ACTIVE_PANE_CWD"'

# prefix+0 focuses the LAST agent in the sidebar (prefix+alt+1..9 covers 1-9;
# 0 = last, like browsers). prefix+9 goes back to the agent you jumped from,
# and pressing it again toggles between the two. Overrides switch_tab's tab 9.
[[keys.command]]
key = "prefix+0"
type = "shell"
description = "Focus the last agent in the sidebar"
command = "~/.local/bin/herdr-agent-jump last"

[[keys.command]]
key = "prefix+9"
type = "shell"
description = "Toggle back to the previous agent"
command = "~/.local/bin/herdr-agent-jump back"

# prefix+o focuses the next agent waiting for you (blocked first, then done,
# longest-waiting first). Works without toast popups, unlike the built-in
# open_notification_target (moved to prefix+shift+o).
[[keys.command]]
key = "prefix+o"
type = "shell"
description = "Focus the next blocked/done agent"
command = "~/.local/bin/herdr-agent-jump next"

# prefix+up / prefix+down step through agents in sidebar order and wrap around
# at both ends (the built-in previous_agent/next_agent on prefix+{ } stay).
[[keys.command]]
key = "prefix+up"
type = "shell"
description = "Focus the agent above in the sidebar"
command = "~/.local/bin/herdr-agent-jump up"

[[keys.command]]
key = "prefix+down"
type = "shell"
description = "Focus the agent below in the sidebar"
command = "~/.local/bin/herdr-agent-jump down"

# Close every other pane in this tab, like tmux `kill-pane -a`.
[[keys.command]]
key = "prefix+e"
type = "shell"
description = "Close other panes in this tab"
command = '''herdr pane list | jq -r --arg t "$HERDR_ACTIVE_TAB_ID" --arg p "$HERDR_ACTIVE_PANE_ID" '.result.panes[] | select(.tab_id == $t and .pane_id != $p) | .pane_id' | xargs -n1 herdr pane close'''

# lazygit in a new pane at the focused pane's cwd.
[[keys.command]]
key = "prefix+g"
type = "pane"
description = "lazygit"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && lazygit'

# Move the current workspace up/down in the sidebar list. herdr has no CLI for
# this, so the script calls workspace.move on the socket API
[[keys.command]]
key = "ctrl+shift+up"
type = "shell"
description = "Move workspace up"
command = "~/.local/bin/herdr-move-workspace up"

[[keys.command]]
key = "ctrl+shift+down"
type = "shell"
description = "Move workspace down"
command = "~/.local/bin/herdr-move-workspace down"

[ui]
pane_gaps = false                    # panes edge to edge, like tmux (default: true)
hide_tab_bar_when_single_tab = true  # default: false

# Mouse UI: click/drag panes, tabs, workspaces. Set false to let the
# terminal handle clicks natively (e.g. Cmd-click URLs).
mouse_capture = true
mouse_scroll_lines = 3

# Same problem on the workspace list: without a gap, multi-row space entries run
# together. 1 blank row between spaces, matching the agents panel below
# (default 0).
[ui.sidebar.spaces]
row_gap = 1

# 0.8.0 changed the default rows of the agent panel, dropping state_text ->
# the working/idle text disappeared from the sidebar. Detection is not broken
# at all: `herdr agent explain <pane>` still reports the right state. Set it
# explicitly so future updates do not change it silently.
#
# This layout restores the 0.7.x one exactly (state_icon is an animated spinner
# while working):
#   my-project      agents
#   ⠐ working       claude
[ui.sidebar.agents]
# The Claude agent block is 4 rows tall, so agents end up glued together and
# hard to tell apart. Insert 1 blank row between blocks (default 0).
row_gap = 1
rows = [["workspace", "tab"], ["state_icon", "state_text", "agent"]]

# For Claude panes only: add an account row and a 5h quota row, so it is clear
# which pane runs which account (one ~/.claude* config dir each) and how much
# quota that account has burned, without hopping into each pane to read its
# statusline.
#
#   my-project      agents
#   ⠐ working       claude
#   👤 alice
#   📊 5h 42% (3h12m)
#
# Row 1 uses $convo instead of the `tab` token: it shows the session name once
# set with /rename, otherwise it falls back to the tab name. The config has no
# conditional clauses, so the script has to make the choice itself and push a
# single token - which means renaming a tab only shows up on the next
# statusline render, not immediately.
#
# The values are pushed in by herdr-claude-meta / herdr-codex-meta via
# pane.report_metadata. Those scripts, and the canonical copy of this sidebar
# section, live in ~/code/claude-toolbox/integrations/herdr (see its README).
# It lives in rows_by_agent rather than in the shared rows, so panes of other
# agents (copilot, cursor) do not get two blank rows.
#
# The quota has to be split into 3 tokens because style tokens are STATIC -
# they cannot change color by value the way state_icon/state_text do (those two
# are built-in tokens that herdr colors by state). On each run the script fills
# exactly one token and sends null for the other two to clear them, so it looks
# just like a dynamic color.
[ui.sidebar.agents.rows_by_agent]
claude = [
  # By default herdr paints a row's secondary token in tokyo-night's comment
  # color (#565f89) - on the panel background #1a1b26 it sinks in completely
  # and is unreadable. Set fg explicitly for both tokens added here ($convo,
  # $acct).
  #
  # #a9b1d6 is tokyo-night's normal fg: readable but still lighter than the
  # bold workspace name next to it, so the importance order of row 1 is not
  # inverted.
  ["workspace", { token = "$convo", fg = "#a9b1d6" }],
  ["state_icon", "state_text", "agent"],
  # Blue goes with the 👤 icon and stays distinct from the green-orange-red
  # range of the quota row right below. Drop `dim` - that is exactly what was
  # washing the fg color out.
  [{ token = "$acct", fg = "#7aa2f7" }],
  [
    { token = "$quota_ok", fg = "#9ece6a" },    # < 70%
    { token = "$quota_warn", fg = "#F49D00" },  # 70-89%
    { token = "$quota_crit", fg = "#f7768e" },  # >= 90%
  ],
]


# Codex metadata from herdr-codex-meta (native state detection is preserved).
codex = [
  ["workspace", "tab"],
  ["state_icon", "state_text", "agent"],
  [{ token = "$acct", fg = "#7aa2f7" }],
  [
    { token = "$quota_ok", fg = "#9ece6a" },
    { token = "$quota_warn", fg = "#F49D00" },
    { token = "$quota_crit", fg = "#f7768e" },
  ],
]

[theme]
# tokyo-night: deep navy background, close to the bg of the iTerm2 "Deep
# Harbor" profile (#182635). Previously name = "terminal" (following iTerm2's
# ANSI palette) but Deep Harbor sets ANSI 8 = #8795a0 (unusually light grey)
# -> the active workspace row turned into a flat grey slab with the text
# drowning in it.
name = "tokyo-night"

[theme.custom]
# 1. The active row is no longer a colored slab: pull the SIDEBAR background to
#    exactly tokyo-night's active-row background (#1a1b26) -> the two sides
#    match. Done this way because panel_bg is confirmed to work, while the
#    token for the active-row background could not be identified (not
#    surface0/1 - already tried).
panel_bg = "#1a1b26"

# Focused agent / active space row: Deep Harbor navy (#182635) lifted ~2 steps,
# so the row stands out without becoming a grey slab. (herdr 0.9.5 exposes
# active_row_bg directly.) Also tried: #3A3122 warm brown, #3B2F4A purple.
active_row_bg = "#2B4058"

# 2. Warm-toned accents, taken from the Deep Harbor palette.
accent = "#FFAD36"   # amber - highlight / selected row
yellow = "#F49D00"   # deep orange
peach  = "#FA8155"   # coral orange
