# herdr configuration — https://herdr.dev/docs/configuration/
# Symlinked to ~/.config/herdr/config.toml (see install.conf.yaml)

onboarding = false

[keys]
# Backtick as prefix (trial). If typing literal ` gets painful
# (code blocks, shell substitution), switch to "ctrl+space".
prefix = "`"
rename_tab = "prefix+,"             # default: prefix+shift+t
rename_workspace = "prefix+<"       # i.e. shift+, — terminals send the shifted char; default: prefix+shift+w

# tmux muscle-memory mappings (see ~/.tmux.conf)
split_vertical = "prefix+|"      # side-by-side split, like tmux `prefix |` (default: prefix+v)
previous_workspace = "prefix+("  # like tmux `prefix (` switch-client -p (default: unbound)
next_workspace = "prefix+)"      # like tmux `prefix )` switch-client -n (default: unbound)
close_pane = "prefix+="          # like tmux `prefix =` kill-pane (default: prefix+x)
toggle_sidebar = "ctrl+shift+left" # prefix-free sidebar toggle (default: prefix+b)

# Nhay giua cac agent (mac dinh herdr de trong ca 3). Tranh p/n (da la
# previous/next tab) va (/) (da la workspace).
previous_agent = "prefix+["
next_agent = "prefix+]"
focus_agent = "prefix+alt+1..9"  # nhay thang toi agent thu N

# Bo 3 tab code / agents / console tai cwd cua pane dang focus.
# herdr khong co option "startup tabs" trong config, nen dung script goi
# socket API (herdr workspace/tab create). `type = "shell"` chay detached,
# khong chiem pane. Script idempotent: tab da dung ten thi dung lai.
#
# Bien workspace DANG mo thanh 3 tab do, roi dong tab hien tai.
# Luu y: tab dang chay agent se bi kill (tru khi no la 1 trong 3 tab).
[[keys.command]]
key = "prefix+t"   # t = tabs. Tranh p/n (previous/next tab) va alt (meta key kho bam).
type = "shell"
description = "Replace this tab with code/agents/console"
command = "~/.local/bin/herdr-workspace-3tabs --here"

# Workspace MOI kem 3 tab do.
[[keys.command]]
key = "prefix+shift+t"  # rename_tab da doi sang prefix+, nen shift+t con trong
type = "shell"
description = "New workspace: code/agents/console"
command = "~/.local/bin/herdr-workspace-3tabs"

[ui]
# Mouse UI: click/drag panes, tabs, workspaces. Set false to let the
# terminal handle clicks natively (e.g. Cmd-click URLs).
mouse_capture = true
mouse_scroll_lines = 3

# 0.8.0 doi default rows cua panel agent, bo state_text -> mat chu
# working/idle trong sidebar. Detection khong he hong: `herdr agent explain
# <pane>` van bao dung state. Set tuong minh de update sau khong doi ngam.
#
# Bo cuc nay dung lai dung layout 0.7.x (state_icon la spinner dong khi working):
#   my-project    agents
#   ⠐ working       claude
[ui.sidebar.agents]
rows = [["workspace", "tab"], ["state_icon", "state_text", "agent"]]

# Rieng pane Claude: them hang account + hang quota 5h, de biet pane nao dang
# chay account nao (~/.claude, ~/.claude-work, ~/.claude-alt) va account do
# da tieu bao nhieu quota, khong phai nhay vao tung pane doc statusline.
#
#   my-project    agents
#   ⠐ working       claude
#   👤 tuantv.nhnd
#   📊 5h 42% (3h12m)
#
# Gia tri do ~/.local/bin/herdr-claude-meta day vao qua pane.report_metadata,
# goi tu cuoi moi ~/.claude*/statusline-command.sh. Dat o rows_by_agent chu
# khong sua rows chung, de pane cua agent khac (copilot, cursor) khong linh hai
# hang trong.
#
# Quota phai tach lam 3 token vi style token la TINH - khong doi mau theo gia
# tri duoc nhu state_icon/state_text (hai token dung san do herdr gan cung mau
# theo state). Moi lan script chi dien dung mot token, hai token con lai gui
# null de xoa, nen nhin ra y het mau dong.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["workspace", "tab"],
  ["state_icon", "state_text", "agent"],
  [{ token = "$acct", dim = true }],
  [
    { token = "$quota_ok", fg = "#9ece6a" },    # < 70%
    { token = "$quota_warn", fg = "#F49D00" },  # 70-89%
    { token = "$quota_crit", fg = "#f7768e" },  # >= 90%
  ],
]

[theme]
# tokyo-night: nen navy dam, gan bg cua iTerm2 profile "Deep Harbor"
# (#182635). Truoc dung name = "terminal" (bam bang ANSI cua iTerm2) nhung
# Deep Harbor de ANSI 8 = #8795a0 (xam sang bat thuong) -> hang workspace
# active thanh mang xam bet, chu chim.
name = "tokyo-night"

[theme.custom]
# 1. Hang active khong con mang mau: keo nen SIDEBAR ve dung mau nen hang
#    active cua tokyo-night (#1a1b26) -> hai ben trung nhau. Lam chieu nay
#    vi panel_bg da xac nhan an chac, con token ve nen hang active thi chua
#    dinh danh duoc (khong phai surface0/1 - da thu).
panel_bg = "#1a1b26"

# 2. Chu tone nong, lay tu palette Deep Harbor.
accent = "#FFAD36"   # amber - highlight / hang dang chon
yellow = "#F49D00"   # cam dam
peach  = "#FA8155"   # cam san ho
