# herdr configuration — https://herdr.dev/docs/configuration/
# Symlinked to ~/.config/herdr/config.toml (see install.conf.yaml)

onboarding = false

[keys]
# Backtick as prefix (trial). If typing literal ` gets painful
# (code blocks, shell substitution), switch to "ctrl+space".
prefix = "`"
rename_tab = "prefix+,"             # default: prefix+shift+t
rename_workspace = "prefix+<"       # i.e. shift+, — terminals send the shifted char; default: prefix+shift+w

# tmux muscle-memory mappings (see ~/.tmux.conf)
split_vertical = "prefix+|"      # side-by-side split, like tmux `prefix |` (default: prefix+v)
previous_workspace = "prefix+("  # like tmux `prefix (` switch-client -p (default: unbound)
next_workspace = "prefix+)"      # like tmux `prefix )` switch-client -n (default: unbound)
close_pane = "prefix+="          # like tmux `prefix =` kill-pane (default: prefix+x)
toggle_sidebar = "ctrl+shift+left" # prefix-free sidebar toggle (default: prefix+b)

# Jump between agents (herdr leaves all 3 unbound by default). Avoid p/n
# (already previous/next tab) and (/) (already workspace).
previous_agent = "prefix+["
next_agent = "prefix+]"
focus_agent = "prefix+alt+1..9"  # jump straight to the Nth agent

# The code / agents / console tab set at the cwd of the focused pane.
# herdr has no "startup tabs" option in the config, so a script drives the
# socket API instead (herdr workspace/tab create). `type = "shell"` runs
# detached and does not take over a pane. The script is idempotent: a tab that
# already has the right name is reused.
#
# Turns the CURRENT workspace into those 3 tabs, then closes the current tab.
# Note: a tab running an agent gets killed (unless it is one of the 3 tabs).
[[keys.command]]
key = "prefix+t"   # t = tabs. Avoid p/n (previous/next tab) and alt (awkward meta key).
type = "shell"
description = "Replace this tab with code/agents/console"
command = "~/.local/bin/herdr-workspace-3tabs --here"

# A NEW workspace with those 3 tabs.
[[keys.command]]
key = "prefix+shift+t"  # rename_tab moved to prefix+, so shift+t is free
type = "shell"
description = "New workspace: code/agents/console"
command = "~/.local/bin/herdr-workspace-3tabs"

[ui]
# Mouse UI: click/drag panes, tabs, workspaces. Set false to let the
# terminal handle clicks natively (e.g. Cmd-click URLs).
mouse_capture = true
mouse_scroll_lines = 3

# 0.8.0 changed the default rows of the agent panel, dropping state_text ->
# the working/idle text disappeared from the sidebar. Detection is not broken
# at all: `herdr agent explain <pane>` still reports the right state. Set it
# explicitly so future updates do not change it silently.
#
# This layout restores the 0.7.x one exactly (state_icon is an animated spinner
# while working):
#   my-project      agents
#   ⠐ working       claude
[ui.sidebar.agents]
# The Claude agent block is 4 rows tall, so agents end up glued together and
# hard to tell apart. Insert 1 blank row between blocks (default 0).
row_gap = 1
rows = [["workspace", "tab"], ["state_icon", "state_text", "agent"]]

# For Claude panes only: add an account row and a 5h quota row, so it is clear
# which pane runs which account (one ~/.claude* config dir each) and how much
# quota that account has burned, without hopping into each pane to read its
# statusline.
#
#   my-project      agents
#   ⠐ working       claude
#   👤 alice
#   📊 5h 42% (3h12m)
#
# Row 1 uses $convo instead of the `tab` token: it shows the session name once
# set with /rename, otherwise it falls back to the tab name. The config has no
# conditional clauses, so the script has to make the choice itself and push a
# single token - which means renaming a tab only shows up on the next
# statusline render, not immediately.
#
# The value is pushed in by ~/.local/bin/herdr-claude-meta via
# pane.report_metadata, called from the end of every
# ~/.claude*/statusline-command.sh. It lives in rows_by_agent rather than in the
# shared rows, so panes of other agents (copilot, cursor) do not get two blank
# rows.
#
# The quota has to be split into 3 tokens because style tokens are STATIC -
# they cannot change color by value the way state_icon/state_text do (those two
# are built-in tokens that herdr colors by state). On each run the script fills
# exactly one token and sends null for the other two to clear them, so it looks
# just like a dynamic color.
[ui.sidebar.agents.rows_by_agent]
claude = [
  # By default herdr paints a row's secondary token in tokyo-night's comment
  # color (#565f89) - on the panel background #1a1b26 it sinks in completely
  # and is unreadable. Set fg explicitly for both tokens added here ($convo,
  # $acct).
  #
  # #a9b1d6 is tokyo-night's normal fg: readable but still lighter than the
  # bold workspace name next to it, so the importance order of row 1 is not
  # inverted.
  ["workspace", { token = "$convo", fg = "#a9b1d6" }],
  ["state_icon", "state_text", "agent"],
  # Blue goes with the 👤 icon and stays distinct from the green-orange-red
  # range of the quota row right below. Drop `dim` - that is exactly what was
  # washing the fg color out.
  [{ token = "$acct", fg = "#7aa2f7" }],
  [
    { token = "$quota_ok", fg = "#9ece6a" },    # < 70%
    { token = "$quota_warn", fg = "#F49D00" },  # 70-89%
    { token = "$quota_crit", fg = "#f7768e" },  # >= 90%
  ],
]

[theme]
# tokyo-night: deep navy background, close to the bg of the iTerm2 "Deep
# Harbor" profile (#182635). Previously name = "terminal" (following iTerm2's
# ANSI palette) but Deep Harbor sets ANSI 8 = #8795a0 (unusually light grey)
# -> the active workspace row turned into a flat grey slab with the text
# drowning in it.
name = "tokyo-night"

[theme.custom]
# 1. The active row is no longer a colored slab: pull the SIDEBAR background to
#    exactly tokyo-night's active-row background (#1a1b26) -> the two sides
#    match. Done this way because panel_bg is confirmed to work, while the
#    token for the active-row background could not be identified (not
#    surface0/1 - already tried).
panel_bg = "#1a1b26"

# 2. Warm-toned accents, taken from the Deep Harbor palette.
accent = "#FFAD36"   # amber - highlight / selected row
yellow = "#F49D00"   # deep orange
peach  = "#FA8155"   # coral orange
